startCommand:
  type: stdio
  config:
    command: "uvx"
    args:
      - "--from"
      - "avito-sdk[tls,excel]"
      - "avito-mcp"
  environmentVariables:
    AVITO_PROXY:
      description: "Optional proxy URL (e.g. http://user:pass@ip:port)"
    AVITO_PROXY_CHANGE_URL:
      description: "Optional URL to trigger mobile proxy IP rotation"
